[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-tts-mic"
version = "0.1.0"
description = "A keyboard-first TTS overlay for a PipeWire virtual microphone"
requires-python = ">=3.11"

[project.scripts]
quick-tts-mic = "quick_tts_mic.app:main"

[project.optional-dependencies]
web = ["pywebview>=6"]
windows-voices = [
    "winrt-Windows.Media.SpeechSynthesis; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quick_tts_mic = ["assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
